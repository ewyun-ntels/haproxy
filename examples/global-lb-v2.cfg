# UD-006/007/008/009/010/011 v2-r3-20261003. Production reservation example.
# Build with USE_GLOBAL_LEASTCONN=1 (implies USE_GLOBAL_LB). Restart-only.
# Replace loopback store/servers and instance-id for each worker deployment.
global
    log stdout format raw local0
    nbthread 4
    stats socket /tmp/global-lb-admin.sock mode 660 level admin

    # >>> Global LB v2 additions: common state store and worker identity
    global-lb state-store 127.0.0.1:6379
    global-lb key-prefix example:global-lb
    global-lb instance-id example/haproxy-0

    # At least one v2-only timer/limit explicitly opts into v2, not v1 sync.
    global-lb timeout reserve 100ms
    global-lb heartbeat-interval 300ms
    global-lb instance-timeout 3s
    global-lb timeout connect 200ms
    global-lb timeout command 100ms
    global-lb reconnect 100ms 5s

    # Safety defaults, configurable uniformly across the group.
    # Retained owner records count toward max-instances (not just live Pods).
    # max-requests is the GROUP total reservation mapping cap, not maxconn.
    global-lb max-instances 16
    global-lb max-requests 1024
    # <<< Global LB v2 additions

defaults
    mode tcp
    log global
    timeout connect 1s
    timeout client 1h
    timeout server 1h

frontend tcp_in
    bind 127.0.0.1:15000
    default_backend tcp_pool

backend tcp_pool
    # >>> Global LB v2 additions: atomic Global reserve, native LC fallback
    balance global-leastconn
    global-lb fallback leastconn
    # <<< Global LB v2 additions
    option redispatch 1
    server a 127.0.0.1:15001 check
    server b 127.0.0.1:15002 check
    server c 127.0.0.1:15003 check
