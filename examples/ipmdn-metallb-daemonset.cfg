# HAProxy 3.4.4 example for the IPMDN MetalLB + HAProxy DaemonSet design.
#
# Traffic path:
#   MetalLB BGP/ECMP -> node primary network -> LoadBalancer Service
#   -> local HAProxy Pod eth0 -> PROXY protocol v2 -> backend Pods
#
# Kubernetes objects (MetalLB, externalTrafficPolicy: Local, DaemonSet,
# Services, NetworkPolicy, and Pod readiness/liveness probes) are intentionally
# outside this HAProxy configuration.
#
# The current feature/3.4/global-leastconn source tree does not yet expose a
# Global LeastConn or Redis/Valkey configuration keyword. The roundrobin line
# below is therefore the design's valid local fallback. Replace it only after
# the custom selector and its configuration grammar have been implemented.
#
# GW Watchdog is intentionally absent. In the MetalLB default path, traffic
# reaches the Pod through the primary CNI interface (eth0), not the Multus
# SR-IOV bond0. Enable a bond0 watchdog only for an SR-IOV direct-path design.

global
    log stdout format raw local0 info
    maxconn 20000

    # >>> IPMDN DESIGN ADDITION 1/5: Runtime API and DS health-check spreading
    # Runtime API for local backend connection counters and operations.
    # Mount /var/run/haproxy as a writable emptyDir in the DaemonSet.
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 2m

    # Avoid synchronized health checks from every DaemonSet instance.
    spread-checks 5
    # <<< IPMDN DESIGN ADDITION 1/5

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    option tcpka

    retries 3
    timeout connect 5s
    timeout client 24h
    timeout server 24h
    timeout queue 30s
    timeout check 2s
    timeout client-fin 30s
    timeout server-fin 30s

# >>> IPMDN DESIGN ADDITION 2/5: Kubernetes DNS/SRV endpoint discovery
# In a Kubernetes Pod, /etc/resolv.conf normally points at the cluster DNS.
# SRV records from the headless Service add/remove backend endpoints at runtime.
resolvers k8s
    parse-resolv-conf
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 30s
    hold nx 30s
    hold timeout 30s
    hold refused 30s
    hold other 30s
# <<< IPMDN DESIGN ADDITION 2/5

# >>> IPMDN DESIGN ADDITION 3/5: MetalLB Service TCP listener
# MetalLB LoadBalancer Service forwards the external TCP port to this listener.
# With externalTrafficPolicy: Local and one HAProxy Pod per eligible node, the
# node receiving the ECMP flow forwards it to its local HAProxy instance.
frontend fe_ipmdn_tcp
    bind :5000
    default_backend be_ipmdn_tcp
# <<< IPMDN DESIGN ADDITION 3/5

# >>> IPMDN DESIGN ADDITION 4/5: Internal-only operational statistics
# Optional operational statistics. Restrict this port with NetworkPolicy and
# do not expose it through the public LoadBalancer Service.
listen monitoring
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
# <<< IPMDN DESIGN ADDITION 4/5

# >>> IPMDN DESIGN ADDITION 5/5: Backend fallback, SRV, health check, and PPv2
backend be_ipmdn_tcp
    mode tcp

    # Safe fallback while Global LeastConn is unavailable. The future global
    # selector must read only an asynchronously refreshed in-memory snapshot;
    # it must never perform a synchronous Redis GET on this connection path.
    balance roundrobin

    # Retry another healthy endpoint if the initial connection attempt fails.
    option redispatch 1

    # Example Kubernetes objects assumed by the SRV label below:
    #   namespace:    ipmdn
    #   headless svc: ipmdn-backend
    #   named port:   ipmdn (TCP/5000)
    #
    # Dynamic servers require explicit check-send-proxy so health-check
    # connections also start with a PROXY protocol v2 header. The backend must
    # accept PPv2 followed by EOF without application payload for these checks.
    # Increase 1-3 if the backend replica ceiling is raised above three.
    server-template ipmdn 1-3 _ipmdn._tcp.ipmdn-backend.ipmdn.svc.cluster.local:5000 resolvers k8s init-addr none check check-send-proxy send-proxy-v2 inter 1s fastinter 500ms downinter 2s rise 2 fall 3
# <<< IPMDN DESIGN ADDITION 5/5
