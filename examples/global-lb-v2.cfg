# UD-006/007/008/009/010/011 v2-r3-20261003. Production reservation example.
# Build with USE_GLOBAL_LEASTCONN=1 (implies USE_GLOBAL_LB). Restart-only.
# Replace loopback store/servers and instance-id for each worker deployment.
# UD-012/016 v2-r4-20261004: admin read-only diagnostics (no store query):
#   show global-lb status        -- v2 owner/HB/restore/fallback status
#   show global-lb reservations  -- local metadata/queue summary, not Global totals
#   show global-lb local         -- unchanged native cur_sess/served table
# v2 has no periodic Global Cache; see doc/global-lb-reservation.txt.
global
    log stdout format raw local0
    nbthread 4
    stats socket /tmp/global-lb-admin.sock mode 660 level admin

    # >>> Global LB v2 additions: common state store and worker identity
    global-lb state-store 127.0.0.1:6379
    global-lb key-prefix example:global-lb
    global-lb instance-id example/haproxy-0

    # UD-007 v2-only-20261004: explicit v2 timers; omitted values use C defaults.
    # UD-001/007/010/016 v2-timeouts-20261004: long-lived TCP deployment.
    # Queue + send + reply share 1s; command timeout does not add another 1s.
    global-lb timeout reserve 1s
    global-lb heartbeat-interval 300ms
    global-lb instance-timeout 3s
    global-lb timeout connect 200ms
    global-lb timeout command 1s
    global-lb reconnect 100ms 5s

    # Safety defaults, configurable uniformly across the group.
    # Retained owner records count toward max-instances (not just live Pods).
    # max-requests is the GROUP total reservation mapping cap, not maxconn.
    global-lb max-instances 16
    global-lb max-requests 1024
    # <<< Global LB v2 additions

defaults
    mode tcp
    log global
    timeout connect 1s
    timeout client 1h
    timeout server 1h

# UD-015/016 four-port-20261005: same four sample listeners as the Helm chart.
# Each backend is a separate Global LB group within the common state store.
# At most 100 expected connections/port across all workers => 400 total.
# This is not a per-port admission limit. Three servers below are sample
# endpoints, not a connection cap. Replace loopback endpoints for deployment.
frontend tcp_in
    bind 127.0.0.1:5000
    default_backend be_ipmdn_tcp

backend be_ipmdn_tcp
    # >>> Global LB v2 additions: atomic Global reserve, native LC fallback
    balance global-leastconn
    global-lb fallback leastconn
    # <<< Global LB v2 additions
    option redispatch 1
    server a 127.0.0.1:15001 check
    server b 127.0.0.1:15002 check
    server c 127.0.0.1:15003 check

frontend tcp_in_2
    bind 127.0.0.1:5001
    default_backend be_ipmdn_tcp_2

backend be_ipmdn_tcp_2
    balance global-leastconn
    global-lb fallback leastconn
    option redispatch 1
    server a 127.0.0.1:16001 check
    server b 127.0.0.1:16002 check
    server c 127.0.0.1:16003 check

frontend tcp_in_3
    bind 127.0.0.1:5002
    default_backend be_ipmdn_tcp_3

backend be_ipmdn_tcp_3
    balance global-leastconn
    global-lb fallback leastconn
    option redispatch 1
    server a 127.0.0.1:17001 check
    server b 127.0.0.1:17002 check
    server c 127.0.0.1:17003 check

frontend tcp_in_4
    bind 127.0.0.1:5003
    default_backend be_ipmdn_tcp_4

backend be_ipmdn_tcp_4
    balance global-leastconn
    global-lb fallback leastconn
    option redispatch 1
    server a 127.0.0.1:18001 check
    server b 127.0.0.1:18002 check
    server c 127.0.0.1:18003 check
