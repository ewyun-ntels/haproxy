# UD-007/009/011 v2-r1-20261003: configuration/protocol helpers only.
# IMPORTANT: step 1 uses LOCAL leastconn; atomic global selection is not wired.
# v2-only timers disable the v1 publisher. Do not mix v1 sync/cache timers.
global
    stats socket /tmp/haproxy-glb-v2-step1.sock mode 600 level admin
    global-lb state-store 127.0.0.1:6379
    global-lb key-prefix ipmdn:global-lb
    global-lb instance-id ipmdn-prod/haproxy-0
    global-lb timeout reserve 100ms
    global-lb heartbeat-interval 300ms
    global-lb instance-timeout 3s

defaults
    mode tcp
    timeout connect 1s
    timeout client 24h
    timeout server 24h

frontend fe_v2_example
    bind 127.0.0.1:18080
    default_backend be_ipmdn_tcp

backend be_ipmdn_tcp
    balance global-leastconn
    global-lb fallback leastconn
    server s1 127.0.0.1:18081
    server s2 127.0.0.1:18082
